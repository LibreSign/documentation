{% extends "!layout.html" %}
{% block content %}
  {% if libresign_preview_pr %}
    <div class="libresign-preview-banner" role="note">
      <strong>Pull request preview</strong> ·
      <a href="https://github.com/LibreSign/documentation/pull/{{ libresign_preview_pr|e }}">PR #{{ libresign_preview_pr|e }}</a>
      <span> — Not published</span>
    </div>
  {% endif %}
  <div class="libresign-manual-navigation libresign-scroll-header">
    {% include "ecosystem-nav.html" %}
  </div>
  {{ super() }}
{% endblock %}
{% block footer %}
  {% include "ecosystem-footer.html" %}
{% endblock %}

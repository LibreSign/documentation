name: Documentation stable15

on:
  pull_request:
    branches: [stable15]
  push:
    branches: [stable15]

permissions:
  contents: read

jobs:
  sphinx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBRESIGN_DOC_VERSION: "15"
      LIBRESIGN_APP_VERSION: "15"
      LIBRESIGN_DOC_STATUS: previous
    steps:
      - name: Checkout documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate every manual
        run: |
          for manual in main user_manual admin_manual developer_manual; do
            sphinx-build -b html -n -W --keep-going "$manual" "_build/$manual"
          done
      - name: Upload reviewable HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable15-documentation-html
          path: _build/
          if-no-files-found: error

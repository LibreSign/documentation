name: Documentation

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - '.github/workflows/deploy.yml'
      - 'versioning/**'
      - 'versioned/**'
      - 'assets/**'
      - '_templates/**'
      - 'main/**'
      - 'admin_manual/**'
      - 'user_manual/**'
      - 'developer_manual/**'
      - 'conf.py'
      - 'requirements.txt'
      - 'tests/**'

permissions:
  contents: read

jobs:
  test:
    name: Sphinx, OpenAPI, links and multiversion checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt openapi-spec-validator==0.7.2

      - name: Test version discovery and deploy invariants
        run: python -m unittest discover -s tests -v

      - name: Test version selection navigation
        run: node --test tests/js/version-switcher.test.mjs

      - name: Build every Sphinx version independently
        run: python -m versioning.build --output _build

      - name: Check links, exact OpenAPI provenance and version isolation
        run: python -m versioning.verify --output _build

      - name: Assemble complete atomic Pages candidate
        run: python -m versioning.publish --built _build --destination _publish

      - name: Verify deployed candidate preserves every version
        run: python -m versioning.verify --output _publish

      - name: Capture rendered version pages
        run: |
          mkdir -p screenshots
          python -m http.server 8765 --directory _publish > /tmp/sphinx-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 2
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --virtual-time-budget=8000 --window-size=1440,1100 \
            --screenshot="screenshots/libresign-versions-home.png" \
            "http://127.0.0.1:8765/" >/dev/null 2>&1
          for version in 13 14 15 main; do
            google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --virtual-time-budget=8000 --window-size=1440,1100 \
              --screenshot="screenshots/libresign-$version.png" \
              "http://127.0.0.1:8765/$version/" >/dev/null 2>&1
          done
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --virtual-time-budget=8000 --window-size=1440,1100 \
            --screenshot="screenshots/openapi-15.png" \
            "http://127.0.0.1:8765/15/developer_manual/api/openapi.html" >/dev/null 2>&1

      - name: Upload screenshots for PR review
        uses: actions/upload-artifact@v4
        with:
          name: versioned-documentation-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 30

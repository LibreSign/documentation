name: Documentation

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - '.github/workflows/deploy.yml'
      - 'versioning/**'
      - 'versioned/**'
      - 'assets/**'
      - '_templates/**'
      - 'main/**'
      - 'admin_manual/**'
      - 'user_manual/**'
      - 'developer_manual/**'
      - 'conf.py'
      - 'requirements.txt'
      - 'tests/**'

permissions:
  contents: read

jobs:
  test:
    name: Sphinx, OpenAPI, links and multiversion checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt openapi-spec-validator==0.7.2

      - name: Test version discovery and deploy invariants
        run: python -m unittest discover -s tests -v

      - name: Test version selection navigation
        run: node --test tests/js/*.test.mjs

      - name: Build every Sphinx version independently
        run: python -m versioning.build --output _build

      - name: Check links, exact OpenAPI provenance and version isolation
        run: python -m versioning.verify --output _build

      - name: Assemble complete atomic Pages candidate
        run: python -m versioning.publish --built _build --destination _publish

      - name: Verify deployed candidate preserves every version
        run: python -m versioning.verify --output _publish

      - name: Capture all published documentation versions
        run: python -m versioning.screenshots --site _publish --output screenshots

      - name: Upload screenshots for PR review
        uses: actions/upload-artifact@v4
        with:
          name: versioned-documentation-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 30

name: Documentation PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: documentation-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIBRESIGN_DOC_BASE_PATH: /site-preview/docs-preview/pr-${{ github.event.pull_request.number }}
      LIBRESIGN_PREVIEW_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt openapi-spec-validator==0.7.2

      - name: Test and build isolated preview
        run: |
          python -m unittest discover -s tests -v
          node --test tests/js/*.test.mjs
          python -m versioning.build --output _build
          python -m versioning.verify --output _build
          python -m versioning.publish --built _build --destination _publish
          python -m versioning.verify --output _publish
          rm _publish/CNAME

      - name: Upload unprivileged preview for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview-site
          path: _publish/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

      - name: Create scoped preview deployment token
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: preview-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.LIBRECODE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.LIBRECODE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: LibreSign
          repositories: site-preview
          permission-contents: write

      - name: Deploy preview to separate GitHub Pages origin
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: LibreSign/pr-preview-action@2a6da1177b47dc23173ba9a75e01da0a0d800978
        with:
          action: deploy
          source-dir: ./_publish/
          umbrella-dir: docs-preview
          pr-number: ${{ github.event.pull_request.number }}
          deploy-repository: LibreSign/site-preview
          preview-branch: gh-pages
          pages-base-url: libresign.github.io/site-preview
          wait-for-pages-deployment: false
          qr-code: true
          token: ${{ steps.preview-token.outputs.token }}

      - name: Check preview URL from separate origin
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PREVIEW_ROOT: https://libresign.github.io/site-preview/docs-preview/pr-${{ github.event.pull_request.number }}
        run: |
          stable=$(python -c "import json; print(json.load(open('_publish/versions.json'))['current_stable'])")
          for url in "$PREVIEW_ROOT/$stable/" "$PREVIEW_ROOT/$stable/developer_manual/api/openapi.html"; do
            success=false
            for attempt in $(seq 1 15); do
              if curl -fsSL --max-time 15 -o /tmp/preview-page.html "$url" &&
                grep -q 'libresign-version-toggle' /tmp/preview-page.html; then
                echo "Preview is publicly navigable: $url"
                success=true
                break
              fi
              sleep 10
            done
            if [ "$success" != true ]; then
              echo "::error::Preview URL did not become reachable: $url" >&2
              exit 1
            fi
          done

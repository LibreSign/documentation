name: Documentation Fork PR Preview Deploy

on:
  workflow_run:
    workflows: ["Documentation PR Preview"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  deploy:
    # Only consume static HTML from a successful, unprivileged fork build.
    # Never checkout or execute the fork's code in this privileged workflow.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number > 0 &&
      github.event.workflow_run.head_repository.id != github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: documentation-preview-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    steps:
      - name: Download unprivileged HTML artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: documentation-preview-site
          path: ./_publish/

      - name: Confirm preview artifact contains versioned pages
        run: |
          test -s _publish/versions.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("_publish")
          catalog = json.loads((root / "versions.json").read_text())
          current = catalog["current_stable"]
          if not re.fullmatch(r"[1-9][0-9]*", current):
              raise ValueError("Invalid current stable release")
          for page in (root / current / "index.html",
                       root / "main/developer_manual/api/openapi.json",
                       root / "_review/index.html",
                       root / "_review/routes.txt"):
              if not page.is_file() or not page.stat().st_size:
                  raise ValueError(f"Missing preview artifact: {page}")
          if (root / "CNAME").exists():
              raise ValueError("Preview artifact must not carry production CNAME")
          PY

      - name: Create scoped preview deployment token
        id: preview-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.LIBRECODE_WORKFLOW_APP_ID }}
          private-key: ${{ secrets.LIBRECODE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: LibreSign
          repositories: site-preview
          permission-contents: write

      - name: Publish fork preview (no fork code execution)
        uses: LibreSign/pr-preview-action@2a6da1177b47dc23173ba9a75e01da0a0d800978
        with:
          action: deploy
          source-dir: ./_publish/
          umbrella-dir: docs-preview
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          deploy-repository: LibreSign/site-preview
          preview-branch: gh-pages
          pages-base-url: libresign.github.io/site-preview
          qr-code: true
          wait-for-pages-deployment: true
          token: ${{ steps.preview-token.outputs.token }}

      - name: Confirm fork preview is publicly navigable
        env:
          PREVIEW_ROOT: https://libresign.github.io/site-preview/docs-preview/pr-${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          for route in "/" "/_review/index.html"; do
            success=false
            for attempt in $(seq 1 24); do
              if curl -fsSL --max-time 15 -o /tmp/libresign-fork-preview.html "$PREVIEW_ROOT$route" &&
                grep -Eq 'Documentation by release|Preview-only documentation' /tmp/libresign-fork-preview.html; then
                success=true
                break
              fi
              sleep 5
            done
            if [ "$success" != true ]; then
              echo "::error::Fork preview unavailable: $PREVIEW_ROOT$route" >&2
              exit 1
            fi
          done

      - name: Post navigable preview links to fork PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          root="https://libresign.github.io/site-preview/docs-preview/pr-$PR_NUMBER"
          body=$(printf '<!-- libresign-documentation-preview-links -->\n### Navigable documentation preview\n\n- [Browse published versions](%s/)\n- [Review unpublished release pages, if any](%s/_review/)\n\nAll pages are isolated from production and checked by the documentation build.\n' "$root" "$root")
          marker='<!-- libresign-documentation-preview-links -->'
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" >/dev/null
          fi
